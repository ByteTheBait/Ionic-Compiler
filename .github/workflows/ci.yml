name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-14      # Apple Silicon; matches primary dev environment

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install system deps
        run: brew install llvm

      # ── Rust cross-OS bootstrap ──────────────────────────────────────────
      # `cargo build --release` produces target/release/ionic — a complete
      # Rust/LLVM-based Ionic compiler that can build user programs on any
      # OS with Rust + clang installed (Linux ARM64, macOS, Windows). This
      # is the path used by future cross-OS CI; the committed ionic_self
      # and ./build.sh handle the self-hosted compiler for now.
      - name: Build Rust compiler
        run: cargo build --release

      - name: Smoke test — hello world (Rust compiler)
        run: |
          echo 'fn main() -> int64 { print("ok"); return 0; }' > /tmp/hi.ionic
          ./target/release/ionic /tmp/hi.ionic -o /tmp/hi
          output=$(/tmp/hi)
          [ "$output" = "ok" ] || (echo "Expected 'ok', got '$output'"; exit 1)

      - name: Smoke test — arithmetic (Rust compiler)
        run: |
          cat > /tmp/arith.ionic << 'EOF'
          fn main() -> int64 {
              let x = 6 * 7;
              print(int64_to_str(x));
              return 0;
          }
          EOF
          ./target/release/ionic /tmp/arith.ionic -o /tmp/arith
          output=$(/tmp/arith)
          [ "$output" = "42" ] || (echo "Expected '42', got '$output'"; exit 1)

      - name: Smoke test — standard library (Rust compiler)
        run: |
          ./target/release/ionic examples/stdlib_test.ionic -o /tmp/stdlib_test
          /tmp/stdlib_test | grep -q "arr_sum = 100" || (echo "arr_sum check failed"; exit 1)
          /tmp/stdlib_test | grep -q "contains: ok"  || (echo "contains check failed"; exit 1)

      # ── Self-hosted bootstrap ────────────────────────────────────────────
      # Build ionic_new from the split .ionic sources using the committed
      # ionic_self binary. This is the self-hosting path used by releases.
      - name: Build self-hosted compiler
        run: ./build.sh

      # The bootstrap binary and the freshly self-hosted compiler must emit an
      # identical object file for the same sources. Compares .o, not the linked
      # binary (the linker always stamps a fresh LC_UUID + code signature).
      - name: Verify self-hosting (object files byte-identical)
        run: ./build.sh --verify-self-hosting

      - name: Smoke test — hello world (self-hosted compiler)
        run: |
          echo 'fn main() -> int64 { print("ok"); return 0; }' > /tmp/hi2.ionic
          ./ionic_new /tmp/hi2.ionic -o /tmp/hi2
          output=$(/tmp/hi2)
          [ "$output" = "ok" ] || (echo "Expected 'ok', got '$output'"; exit 1)

      - name: Smoke test — arithmetic (self-hosted compiler)
        run: |
          cat > /tmp/arith2.ionic << 'EOF'
          fn main() -> int64 {
              let x = 6 * 7;
              print(int64_to_str(x));
              return 0;
          }
          EOF
          ./ionic_new /tmp/arith2.ionic -o /tmp/arith2
          output=$(/tmp/arith2)
          [ "$output" = "42" ] || (echo "Expected '42', got '$output'"; exit 1)

      - name: Smoke test — standard library (self-hosted compiler)
        run: |
          ./ionic_new examples/stdlib_test.ionic -o /tmp/stdlib_test2
          /tmp/stdlib_test2 | grep -q "arr_sum = 100" || (echo "arr_sum check failed"; exit 1)
          /tmp/stdlib_test2 | grep -q "contains: ok"  || (echo "contains check failed"; exit 1)

      - name: Smoke test — global/param shadowing in recursion (self-hosted)
        run: |
          # Regression: a top-level `let n = <int>` becomes an inlined
          # compile-time constant. A function parameter of the same name must
          # still shadow it, or `rec(n - 1)` reads the constant forever and the
          # recursion guard never fires (stack-overflow / SIGSEGV).
          cat > /tmp/shadow.ionic << 'EOF'
          let n = 10;
          fn rec(int64 n) -> int64 { if (n <= 1) { return 1; } return rec(n - 1); }
          print(rec(5));
          EOF
          ./ionic_new /tmp/shadow.ionic -o /tmp/shadow
          output=$(/tmp/shadow)
          [ "$output" = "1" ] || (echo "Expected '1', got '$output'"; exit 1)

      # ── Hardware-placement tags (@gpu fn / @cpu fn) ──────────────────────
      # An @gpu fn body must be checked as GPU context (same rules as a
      # gpu { } block): CPU-only I/O and tensor@cpu values are rejected, and
      # @cpu functions may not be called from it.
      - name: Hardware tags — @gpu/@cpu fn accepted (self-hosted compiler)
        run: |
          ./ionic_new examples/hw_tags.ionic -o /tmp/hw_tags
          /tmp/hw_tags | grep -q "42" || (echo "hw_tags run check failed"; exit 1)

      - name: Hardware tags — @gpu fn violations rejected (self-hosted compiler)
        run: |
          if ./ionic_new examples/hw_tag_error.ionic -o /tmp/hw_tag_err 2>/dev/null; then
            echo "Expected hw_tag_error.ionic to be rejected, but it compiled"; exit 1
          fi
          ./ionic_new examples/hw_tag_error.ionic -o /tmp/hw_tag_err 2>&1 \
            | grep -q "CPU-only I/O" || (echo "missing GPU-context diagnostic"; exit 1)

      # ── Tree-sitter grammar ──────────────────────────────────────────────
      # The grammar/queries are derived from the language; make sure they still
      # parse the whole tree (catches drift after syntax changes).
      - name: Tree-sitter grammar parses the sources
        run: |
          npm install -g tree-sitter-cli
          cd tree-sitter-ionic
          tree-sitter generate
          for f in ../examples/*.ionic ../lib/std/*.ionic ../src/main.ionic; do
            if tree-sitter parse "$f" | grep -qE 'ERROR|MISSING'; then
              echo "parse error in $f"; exit 1
            fi
          done
          tree-sitter query queries/highlights.scm ../examples/hw_tags.ionic >/dev/null
